<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Checkout-Details </title>
    <link rel="stylesheet" href="Styles/checkout-details.css" />
  </head>
  <body>

    <div class = "top-bar"> <img src="/images/amazon-logo.png" class="logo-image">
    </div>
    <div class="main-body"> 
      <h  class="personal-information-heading"> Enter Shipping Information </h>
      <div class = "Personal-information">  <!-- for address infomation  -->
        
        <div class="name"> 
          <label class="required"> Name: </label>
          <input type="name" class="input"> 
        </div>
  
       
        
        <div class="email"> 
          <label class="required">  Email:</label>
          <input type="email" class="input"> 
        </div>

        <div class="confirm-email"> 
          <label class="required"> Confirm Email:</label>
          <input type="email" class="input"> 
        </div>
   
        <div class="phone-number">
          <label class="required">  
         Phone Number: </label>
          <input type="phone-number" class="input"> 
        </div>
  
        <div class="address"> 
          <label class="required"> Street Address: </label>
          <input type="address" class="input"> 
        </div>
        <div class="apt-suite"> 
          <label > Apt/Suite/Other 
            <span class="optional"> (optional) </span>  </label>
          <input type="address" class="input-apt-suite"> 
        </div>

        <div class="zip-city"> 
          <div class="zip-code"> 
            <label class="required"> Zip-code: </label>
            <input type="address" class="input-new"> 
            </div>
            <div class="city"> 
              <label class="required"> City: </label>
              <input type="address" class="input input-new"> 
            </div>

          </div>
         
        </div>
        <div class="state"> 
          <label class="required"> State: </label>
          <input type="state" class="input"> 
        </div>
       
        
      </div> 
  
     
  
     <button class="Submit-order" > Continue to Payment</button>
     
    
    </div>
    
    <script src="config.js"></script>
  <script src="Scripts/checkout-details.js"> </script>
  </body>
</html>
