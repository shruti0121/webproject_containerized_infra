<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment-details</title>
  <link rel="stylesheet" href="Styles/payment-details.css" />
</head>
<body>

  <div class="main-box">
   <div class ="payment-details-header">
    Payment details 
   </div>
   <div class = "card-details">
    <div class="card-name"> 
      Cardholder Name:
      <input type="name" class="input"> 
    </div>

    <div class="card-number"> 
      Card Number:
      <input type="number" class="input"> 
    </div>

    <div class="expiry-cv"> 
      <div class="expiry"> 
       Expiry:
        <input type="expiry" class="input-expiry"> 
      </div>
      <div class="cvv"> 
        Security Code:
        <input type="number" class="input-cvv"> 
      </div>
    </div>
    <button class = "button" onclick="window.location.href='order-confirmation.html'"> Pay Now </button>

   </div>
   

  </div>
  
</body>
</html>
